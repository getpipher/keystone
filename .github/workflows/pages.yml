# Publishes the comparison gallery to GitHub Pages.
# Site root = test/compare/gallery (index.html has its entries inlined, so the
# site is fully static; per-brief renders + scores ship inside the artifact).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "test/compare/gallery/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: test/compare/gallery
      - id: deployment
        uses: actions/deploy-pages@v4
